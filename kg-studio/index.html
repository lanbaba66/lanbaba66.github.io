<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AI 知识图谱 Studio｜知识结构规划与可视化系统</title><style>
:root{--bg:#f8fbfc;--ink:#27333a;--muted:#788790;--line:#ccdce3}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 65% 50%,rgba(89,159,178,.11),transparent 38%),linear-gradient(rgba(80,110,125,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(80,110,125,.045) 1px,transparent 1px);background-size:auto,72px 72px,72px 72px;pointer-events:none}header{position:fixed;z-index:5;top:42px;left:54px;max-width:440px;pointer-events:none}h1{margin:0;font-size:clamp(28px,3.4vw,48px);font-weight:590;letter-spacing:-.045em}header p{margin:12px 0 0;color:var(--muted);line-height:1.7;font-size:13px}#graph{width:100vw;height:100vh;touch-action:none;cursor:grab}#graph.drag{cursor:grabbing}.toolbar{position:fixed;z-index:8;top:28px;right:34px;display:flex;gap:8px;align-items:center}.search{width:min(300px,42vw);padding:10px 13px;border:1px solid #d5e2e7;border-radius:13px;background:rgba(255,255,255,.94);outline:none;box-shadow:0 10px 28px rgba(60,90,105,.07)}.btn{border:1px solid #d5e2e7;border-radius:11px;background:rgba(255,255,255,.9);color:#5d717b;padding:9px 11px;cursor:pointer}.legend{position:fixed;z-index:8;left:42px;bottom:30px;display:flex;gap:7px;flex-wrap:wrap;max-width:70vw;padding:6px;border:1px solid rgba(125,155,168,.16);border-radius:15px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px)}.legend button{border:1px solid transparent;background:transparent;border-radius:999px;padding:7px 10px;color:#687982;cursor:pointer}.legend button.on{border-color:#bdd8e2;background:#f0f8fa;color:#34444c}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}.meta{position:fixed;right:40px;bottom:36px;color:#9aa7ad;font:10px ui-monospace,monospace;letter-spacing:.08em}.panel{position:fixed;z-index:20;right:28px;top:96px;width:min(390px,calc(100vw - 40px));max-height:calc(100vh - 150px);overflow:auto;padding:24px;border:1px solid #dce7ec;border-radius:20px;background:rgba(255,255,255,.97);box-shadow:0 24px 70px rgba(60,90,105,.16);display:none}.panel.show{display:block}.close{float:right;border:0;background:#eef4f6;border-radius:50%;width:32px;height:32px;font-size:20px;color:#71828a;cursor:pointer}.cat{font-size:11px;color:#5a9ed6;font-weight:700;letter-spacing:.08em}.panel h2{font-size:30px;margin:6px 0 10px;letter-spacing:-.04em}.desc{color:#5f7079;line-height:1.75;font-size:14px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tags span{border:1px solid #dce7ec;border-radius:999px;padding:5px 9px;color:#63757e;font-size:10px}.rels{padding:0;list-style:none;display:grid;gap:6px}.rels li{padding:8px 10px;border:1px solid #e5eef1;border-radius:10px;color:#60727b;font-size:12px;background:#fbfdfe}.node{cursor:pointer}.node text{font-size:12px;fill:#53666f;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.edge{stroke:#9bb2bc;stroke-opacity:.35;stroke-width:1.2}.node circle{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 2px 4px rgba(50,80,95,.12))}@media(max-width:720px){header{top:24px;left:22px;right:22px}header p{max-width:72vw}.toolbar{top:auto;bottom:78px;left:18px;right:18px}.search{width:100%;min-width:0}.legend{left:18px;right:18px;bottom:16px;max-width:none}.meta{display:none}.panel{top:86px;right:16px;left:16px;width:auto}}
</style></head><body><header><h1 id="title"></h1><p id="subtitle"></p></header><div class="toolbar"><input class="search" id="search" placeholder="搜索节点…" aria-label="搜索节点"><button class="btn" id="reset">重置视图</button></div><svg id="graph" viewBox="0 0 1200 800" aria-label="交互式知识图谱"><g id="viewport"><g id="edges"></g><g id="nodes"></g></g></svg><div class="legend" id="legend"></div><div class="meta" id="meta"></div><aside class="panel" id="panel"><button class="close" id="close">×</button><div class="cat" id="pcat"></div><h2 id="pname"></h2><div class="desc" id="pdesc"></div><div class="tags" id="ptags"></div><h3>相关关系</h3><ul class="rels" id="prels"></ul></aside><script>
const D={"title":"函数逼近与数值计算知识图谱","subtitle":"从插值、求积到误差与稳定性","cats":{"interpolation":{"name":"插值与逼近"},"quadrature":{"name":"数值积分"},"error-analysis":{"name":"误差分析"},"reliability":{"name":"可靠性与自适应"}},"nodes":[{"id":"polynomial-interpolation","name":"多项式插值","cat":"interpolation","desc":"用次数受限的多项式在指定节点精确复现函数值。","tags":["插值","多项式","逼近"],"imp":1,"x":0.548162,"y":0.407623},{"id":"lagrange-interpolation","name":"Lagrange 插值","cat":"interpolation","desc":"利用在单个节点取 1、其余节点取 0 的基函数直接表达插值多项式。","tags":["Lagrange","基函数"],"imp":0.8,"x":0.518155,"y":0.46214},{"id":"newton-interpolation","name":"Newton 插值","cat":"interpolation","desc":"利用差商逐层构造并支持新增节点时增量更新的插值形式。","tags":["Newton","差商"],"imp":0.84,"x":0.480974,"y":0.450422},{"id":"divided-difference","name":"差商","cat":"interpolation","desc":"Newton 插值中用于组织递推系数与节点信息的量。","tags":["差商","递推"],"imp":0.66,"x":0.443298,"y":0.367},{"id":"interpolation-remainder","name":"插值余项","cat":"interpolation","desc":"把插值误差与高阶导数和节点乘积联系起来的理论表达。","tags":["误差","余项"],"imp":0.78,"x":0.489317,"y":0.397487},{"id":"runge-phenomenon","name":"Runge 现象","cat":"interpolation","desc":"等距高次多项式插值可能在区间端点产生增强振荡。","tags":["Runge","振荡","节点选择"],"imp":0.82,"x":0.507023,"y":0.350613},{"id":"piecewise-approximation","name":"分段低次逼近","cat":"interpolation","desc":"用多个局部低次多项式替代一个全局高次多项式。","tags":["分段","局部逼近"],"imp":0.7,"x":0.543867,"y":0.298898},{"id":"quadrature-formula","name":"求积公式","cat":"quadrature","desc":"用有限个函数值的加权和近似定积分。","tags":["积分","权重","节点"],"imp":1,"x":0.604353,"y":0.499776},{"id":"newton-cotes","name":"Newton-Cotes 公式","cat":"quadrature","desc":"在等距节点上先插值再积分得到的一族求积公式。","tags":["Newton-Cotes","等距节点"],"imp":0.86,"x":0.650104,"y":0.522592},{"id":"trapezoidal-rule","name":"梯形公式","cat":"quadrature","desc":"用一次多项式近似被积函数的基本求积公式。","tags":["梯形","复合求积"],"imp":0.74,"x":0.606872,"y":0.563166},{"id":"simpson-rule","name":"Simpson 公式","cat":"quadrature","desc":"使用三个节点上的二次插值多项式得到的求积公式。","tags":["Simpson","二次插值"],"imp":0.78,"x":0.606838,"y":0.443803},{"id":"gaussian-quadrature","name":"Gaussian 求积","cat":"quadrature","desc":"同时设计节点和权重以提高固定节点数下的多项式精确度。","tags":["Gaussian","非等距节点"],"imp":0.86,"x":0.640659,"y":0.411419},{"id":"truncation-error","name":"截断误差","cat":"error-analysis","desc":"用有限步骤或有限阶公式替代理想数学过程所产生的误差。","tags":["误差","离散化"],"imp":0.92,"x":0.527062,"y":0.569743},{"id":"roundoff-error","name":"舍入误差","cat":"error-analysis","desc":"有限精度表示与算术运算引入的误差。","tags":["误差","浮点","有限精度"],"imp":0.9,"x":0.461995,"y":0.658226},{"id":"error-estimation","name":"误差估计","cat":"error-analysis","desc":"通过理论误差阶或不同尺度结果比较获得可执行的误差指示。","tags":["误差控制","估计"],"imp":0.9,"x":0.441364,"y":0.580903},{"id":"conditioning","name":"问题条件性","cat":"reliability","desc":"描述输入小扰动被数学问题本身放大的程度。","tags":["条件数","病态问题"],"imp":0.96,"x":0.351973,"y":0.471892},{"id":"algorithmic-stability","name":"算法稳定性","cat":"reliability","desc":"描述算法如何传播计算过程中产生的扰动与舍入误差。","tags":["稳定性","误差传播"],"imp":0.98,"x":0.395198,"y":0.528844},{"id":"convergence","name":"收敛性","cat":"reliability","desc":"离散尺度逐渐细化时数值结果趋近目标数学量的性质。","tags":["收敛","步长"],"imp":0.94,"x":0.32865,"y":0.523492},{"id":"adaptive-integration","name":"自适应积分","cat":"reliability","desc":"依据局部误差估计动态决定哪些区间需要继续细分。","tags":["自适应","积分","误差控制"],"imp":0.9,"x":0.43581,"y":0.465336}],"edges":[{"s":"lagrange-interpolation","t":"polynomial-interpolation","r":"part_of","d":true},{"s":"newton-interpolation","t":"polynomial-interpolation","r":"part_of","d":true},{"s":"divided-difference","t":"newton-interpolation","r":"used_in","d":true},{"s":"interpolation-remainder","t":"polynomial-interpolation","r":"related_to","d":false},{"s":"runge-phenomenon","t":"polynomial-interpolation","r":"related_to","d":false},{"s":"piecewise-approximation","t":"runge-phenomenon","r":"related_to","d":false},{"s":"newton-cotes","t":"polynomial-interpolation","r":"derived_from","d":true},{"s":"newton-cotes","t":"quadrature-formula","r":"part_of","d":true},{"s":"trapezoidal-rule","t":"newton-cotes","r":"part_of","d":true},{"s":"simpson-rule","t":"newton-cotes","r":"part_of","d":true},{"s":"gaussian-quadrature","t":"quadrature-formula","r":"part_of","d":true},{"s":"truncation-error","t":"trapezoidal-rule","r":"related_to","d":false},{"s":"truncation-error","t":"simpson-rule","r":"related_to","d":false},{"s":"interpolation-remainder","t":"truncation-error","r":"related_to","d":false},{"s":"roundoff-error","t":"algorithmic-stability","r":"related_to","d":false},{"s":"conditioning","t":"algorithmic-stability","r":"related_to","d":false},{"s":"convergence","t":"error-estimation","r":"related_to","d":false},{"s":"error-estimation","t":"adaptive-integration","r":"used_in","d":true},{"s":"adaptive-integration","t":"quadrature-formula","r":"related_to","d":false},{"s":"runge-phenomenon","t":"algorithmic-stability","r":"related_to","d":false},{"s":"gaussian-quadrature","t":"runge-phenomenon","r":"related_to","d":false}]};const COLORS=['#5A9ED6','#6FB69A','#C38DDC','#E1A76A','#6BA9B8','#B28B67'];const relName={related_to:'相关',part_of:'属于',prerequisite_of:'前置于',used_in:'用于',derived_from:'源自',custom:'关系'};const $=s=>document.querySelector(s);$('#title').textContent=D.title;$('#subtitle').textContent=D.subtitle||'独立知识图谱页面';$('#meta').textContent=`${D.nodes.length} 个节点 · ${D.edges.length} 条关系`;const catIds=Object.keys(D.cats),color=new Map(catIds.map((id,i)=>[id,COLORS[i%COLORS.length]]));const byId=new Map(D.nodes.map(n=>[n.id,n]));const svg=$('#graph'),vp=$('#viewport'),eg=$('#edges'),ng=$('#nodes');let scale=1,tx=0,ty=0,drag=null,activeCat=null;const tr=()=>vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);const xy=n=>[100+n.x*1000,70+n.y*650];D.edges.forEach(e=>{const a=byId.get(e.s),b=byId.get(e.t);if(!a||!b)return;const [x1,y1]=xy(a),[x2,y2]=xy(b),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.classList.add('edge');l.dataset.s=e.s;l.dataset.t=e.t;eg.append(l)});function openNode(n){$('#panel').classList.add('show');$('#pcat').textContent=D.cats[n.cat]?.name||n.cat;$('#pname').textContent=n.name;$('#pdesc').textContent=n.desc||'暂无说明';$('#ptags').replaceChildren(...n.tags.map(t=>{const s=document.createElement('span');s.textContent=t;return s}));const rs=D.edges.filter(e=>e.s===n.id||e.t===n.id);$('#prels').replaceChildren(...rs.map(e=>{const other=byId.get(e.s===n.id?e.t:e.s),li=document.createElement('li');li.textContent=`${relName[e.r]||e.r} · ${other?.name||''}`;li.onclick=()=>other&&openNode(other);li.style.cursor='pointer';return li}))}D.nodes.forEach(n=>{const [x,y]=xy(n),g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('node');g.dataset.id=n.id;g.dataset.cat=n.cat;g.setAttribute('transform',`translate(${x} ${y})`);const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r',7+5*(n.imp||.5));c.setAttribute('fill',color.get(n.cat));const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',15);t.setAttribute('y',4);t.textContent=n.name;g.append(c,t);g.onclick=e=>{e.stopPropagation();openNode(n)};ng.append(g)});function applyFilter(){document.querySelectorAll('.node').forEach(el=>el.style.opacity=!activeCat||el.dataset.cat===activeCat?'1':'.14');document.querySelectorAll('.edge').forEach(el=>{const a=byId.get(el.dataset.s),b=byId.get(el.dataset.t);el.style.opacity=!activeCat||a?.cat===activeCat||b?.cat===activeCat?'1':'.08'})}catIds.forEach(id=>{const b=document.createElement('button');b.innerHTML=`<span class="dot" style="background:${color.get(id)}"></span>${D.cats[id].name}`;b.onclick=()=>{activeCat=activeCat===id?null:id;document.querySelectorAll('#legend button').forEach(x=>x.classList.toggle('on',x===b&&!!activeCat));applyFilter()};$('#legend').append(b)});$('#close').onclick=()=>$('#panel').classList.remove('show');$('#reset').onclick=()=>{scale=1;tx=0;ty=0;tr()};svg.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaY<0?1.1:.9;scale=Math.max(.55,Math.min(2.8,scale*k));tr()},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest?.('.node'))return;drag={x:e.clientX,y:e.clientY,tx,ty};svg.classList.add('drag');svg.setPointerCapture?.(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+(e.clientX-drag.x);ty=drag.ty+(e.clientY-drag.y);tr()});const end=()=>{drag=null;svg.classList.remove('drag')};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.node').forEach(el=>{const n=byId.get(el.dataset.id),hit=!q||[n.name,n.desc,...n.tags].join(' ').toLowerCase().includes(q);el.style.display=hit?'':'none'})});tr();
</script></body></html>
