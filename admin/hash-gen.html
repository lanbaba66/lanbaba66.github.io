<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码哈希生成器 · Wang Blog Admin</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 24px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; padding: 8px 12px; margin-top: 4px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
  button { margin-top: 24px; padding: 12px 24px; background: #0085a1; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
  button:hover { background: #006b82; }
  pre { background: #f5f5f5; padding: 16px; border-radius: 4px; overflow-x: auto; font-size: 13px; margin-top: 16px; }
  .result { display: none; margin-top: 24px; }
  .note { color: #888; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<h1>密码哈希生成器</h1>
<p>设置后台管理员凭证。生成后把输出粘贴到 <code>admin/pbkdf2.js</code>。</p>

<label>用户名</label>
<input type="text" id="username" value="admin" placeholder="admin">

<label>密码</label>
<input type="password" id="password" placeholder="输入密码">

<button onclick="generate()">生成哈希</button>

<div class="result" id="result">
  <p>生成成功！将下方代码粘贴到 <code>admin/pbkdf2.js</code>：</p>
  <pre id="output"></pre>
  <p class="note">生成后关闭本页面即可。盐和哈希仅存于 pbkdf2.js 中。</p>
</div>

<script>
async function generate() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) return alert('请填写用户名和密码');

  // 生成 32 字节随机盐
  const salt = crypto.getRandomValues(new Uint8Array(32));

  // PBKDF2 派生
  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']
  );
  const derived = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' },
    keyMaterial, 256
  );

  const saltHex = Array.from(salt).map(b => b.toString(16).padStart(2, '0')).join('');
  const hashHex = Array.from(new Uint8Array(derived)).map(b => b.toString(16).padStart(2, '0')).join('');

  document.getElementById('output').textContent =
`const ADMIN_AUTH = {
  username: "${username}",
  salt: "${saltHex}",
  hash: "${hashHex}",
  iterations: 210000
};`;
  document.getElementById('result').style.display = 'block';
}
</script>
</body>
</html>
