<!-- GitHub Pages 尾斜杠修复：/archive?tag=math → /archive/?tag=math -->
<script>
(function() {
	var p = location.pathname;
	// 非根路径、不以 / 结尾、不含文件扩展名 → 可能是缺尾斜杠触发的 404
	if (p !== '/' && p.slice(-1) !== '/' && p.indexOf('.') === -1) {
		location.replace(p + '/' + location.search + location.hash);
	}
})();
</script>
